name: Update ADS Data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch ADS metrics and publications
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python scripts/ads_metrics.py

      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update ADS publications and citations"
          file_pattern: "data/*.json"
